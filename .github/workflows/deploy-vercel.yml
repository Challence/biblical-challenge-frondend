name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      APP_ORIGINS: ${{ vars.APP_ORIGINS }}
      PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Link Supabase project through IPv4 pooler
        run: >
          pnpm exec supabase link
          --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview Supabase migrations
        run: pnpm exec supabase db push --dry-run

      - name: Apply Supabase migrations
        run: pnpm exec supabase db push

      - name: Configure Supabase Edge Function secrets
        run: |
          pnpm exec supabase secrets set \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="$VAPID_SUBJECT" \
            APP_ORIGINS="$APP_ORIGINS" \
            PUSH_CRON_SECRET="$PUSH_CRON_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Supabase Edge Functions
        run: |
          pnpm exec supabase functions deploy push-subscriptions --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase functions deploy send-push-reminders --project-ref "$SUPABASE_PROJECT_REF"

      - name: Pull Vercel production configuration
        run: pnpm dlx vercel@41.7.2 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: pnpm dlx vercel@41.7.2 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to Vercel
        run: pnpm dlx vercel@41.7.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
