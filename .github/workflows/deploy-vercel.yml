name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      APP_ORIGINS: ${{ vars.APP_ORIGINS }}
      PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN
            SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_PUBLISHABLE_KEY
            VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT APP_ORIGINS PUSH_CRON_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required deployment variable: $name" >&2
              exit 1
            fi
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Link Supabase project through IPv4 pooler
        run: >
          pnpm exec supabase link
          --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview Supabase migrations
        run: pnpm exec supabase db push --linked --dry-run

      - name: Apply Supabase migrations
        run: pnpm exec supabase db push --linked

      - name: Configure Supabase Edge Function secrets
        run: |
          pnpm exec supabase secrets set \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="$VAPID_SUBJECT" \
            APP_ORIGINS="$APP_ORIGINS" \
            PUSH_CRON_SECRET="$PUSH_CRON_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Supabase Edge Functions
        run: |
          pnpm exec supabase functions deploy push-subscriptions --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase functions deploy send-push-reminders --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase functions deploy push-reminder-settings --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase functions deploy analytics-events --project-ref "$SUPABASE_PROJECT_REF"

      - name: Configure push reminder cron
        env:
          PUSH_PROJECT_URL: ${{ vars.SUPABASE_URL }}
        run: |
          sql_file="$RUNNER_TEMP/configure-push-cron.sql"
          SQL_FILE="$sql_file" PUSH_CRON_SECRET="$PUSH_CRON_SECRET" PUSH_PROJECT_URL="$PUSH_PROJECT_URL" node --input-type=module <<'NODE'
            import { writeFileSync } from "node:fs"
            const literal = (value) => `'${value.replaceAll("'", "''")}'`
            const sql = `
            do \$\$
            declare
              project_secret_id uuid;
              cron_job_id bigint;
            begin
              select id into project_secret_id from vault.secrets where name = 'push_project_url';
              if project_secret_id is null then
                perform vault.create_secret(${literal(process.env.PUSH_PROJECT_URL)}, 'push_project_url');
              else
                perform vault.update_secret(project_secret_id, ${literal(process.env.PUSH_PROJECT_URL)}, 'push_project_url');
              end if;

              select id into project_secret_id from vault.secrets where name = 'push_cron_secret';
              if project_secret_id is null then
                perform vault.create_secret(${literal(process.env.PUSH_CRON_SECRET)}, 'push_cron_secret');
              else
                perform vault.update_secret(project_secret_id, ${literal(process.env.PUSH_CRON_SECRET)}, 'push_cron_secret');
              end if;

              select jobid into cron_job_id from cron.job where jobname = 'send-push-reminders';
              if cron_job_id is not null then perform cron.unschedule(cron_job_id); end if;
               perform cron.schedule(
                 'send-push-reminders', '* * * * *',
                 $cron$select net.http_post(
                   url := (select decrypted_secret from vault.decrypted_secrets where name = 'push_project_url') || '/functions/v1/send-push-reminders',
                   headers := jsonb_build_object('Content-Type', 'application/json', 'Authorization', 'Bearer ' || (select decrypted_secret from vault.decrypted_secrets where name = 'push_cron_secret')),
                   body := '{}'::jsonb
                 );$cron$
               );
               if not exists (select 1 from pg_extension where extname = 'pg_cron') then
                 raise exception 'pg_cron extension is not installed';
               end if;
               if not exists (select 1 from pg_extension where extname = 'pg_net') then
                 raise exception 'pg_net extension is not installed';
               end if;
               if not exists (
                 select 1 from vault.secrets
                 where name in ('push_project_url', 'push_cron_secret')
                 group by 1 having count(*) = 2
               ) then
                 raise exception 'push cron Vault secrets are not configured';
               end if;
               if not exists (
                 select 1 from cron.job
                 where jobname = 'send-push-reminders'
                   and active
                   and schedule = '* * * * *'
               ) then
                 raise exception 'send-push-reminders cron is not active every minute';
               end if;
             end \$\$;
            `
            writeFileSync(process.env.SQL_FILE, sql)
          NODE
          pnpm exec supabase db query --linked --file "$sql_file"
          rm -f "$sql_file"

      - name: Pull Vercel production configuration
        run: pnpm dlx vercel@65.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: pnpm dlx vercel@65.9.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to Vercel
        run: pnpm dlx vercel@65.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
