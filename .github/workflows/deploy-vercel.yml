name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # env:s
    # VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    # VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    # VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pull Vercel production configuration
        run: pnpm dlx vercel@41.7.2 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: pnpm dlx vercel@41.7.2 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to Vercel
        run: pnpm dlx vercel@41.7.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
